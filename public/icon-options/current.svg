<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Moomin mug">
  <rect width="512" height="512" rx="112" fill="#6b4e8c"/>
  <g fill="#efe9f6">
    <!-- two ears peeking over the rim -->
    <path d="M172 260 C172 178 196 140 214 140 C232 140 256 178 256 260 Z"/>
    <path d="M256 260 C256 178 280 140 298 140 C316 140 340 178 340 260 Z"/>
    <!-- mug body -->
    <path d="M132 252 h248 v104 a62 62 0 0 1 -62 62 h-124 a62 62 0 0 1 -62 -62 z"/>
  </g>
  <!-- handle -->
  <path d="M380 300 a50 50 0 0 1 0 100" fill="none" stroke="#efe9f6" stroke-width="30" stroke-linecap="round"/>
  <!-- rim line, so the ears read as peeking from behind the mug -->
  <rect x="132" y="246" width="248" height="9" rx="4.5" fill="#6b4e8c"/>
</svg>
